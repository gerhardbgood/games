/*
	Card Games
		
	This is the build.gradle file for: cardGames
*/

plugins {
  id 'application'
  id 'java'
  id 'eclipse'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

version = '0.0.1'

repositories {
	mavenCentral()
}
    
dependencies {
	// https://mvnrepository.com/artifact/org.testng/testng
	testImplementation 'org.testng:testng:7.11.0'    
}

jar {
	manifest {
		attributes(
		"Main-Class":"org.gerhardb.games.card.PlayBlackjack",
        'Automatic-Module-Name': "org.gerhardb.games.card.PlayBlackjack",
		"Implementation-Title": "JIBS Card Games",
		"Implementation-Version": version,
		"Implementation-URL":"www.jibs.us",
		"Implementation-Vendor":"Gerhard Beck",
		"Implementation-Vendor-Id":"org.gerhardb",
		'Built-By': System.getProperty('user.name'),
		'Built-Date': new Date(),
		'Built-JDK': System.getProperty('java.version'),
		'Built-Gradle': gradle.gradleVersion
		)
	}
}